services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: hadith-hotel-2-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3006:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: production
      VISITOR_IP_HASH_SECRET: ${VISITOR_IP_HASH_SECRET}
      VISITOR_GEOLOOKUP_URL: ${VISITOR_GEOLOOKUP_URL:-https://ipwho.is/{ip}}
      VISITOR_MAJOR_CITIES: ${VISITOR_MAJOR_CITIES:-}
      VISITOR_TRUST_CLOUDFLARE_HEADERS: ${VISITOR_TRUST_CLOUDFLARE_HEADERS:-false}
