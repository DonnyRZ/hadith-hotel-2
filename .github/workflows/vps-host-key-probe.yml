name: Temporary read-only VPS access check

on:
  push:
    branches:
      - codex/hadith-hotel-deploy-workflows
    paths:
      - .github/workflows/vps-host-key-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Pin the host key collected from the GitHub runner
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" == '212.85.24.238' ]] || { echo '::error::Unexpected VPS_HOST'; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          install -m 600 .github/vps-known-hosts-probe.txt "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$VPS_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null

      - name: Install SSH password client
        run: |
          set -euo pipefail
          if ! command -v sshpass >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y sshpass
          fi

      - name: Run read-only VPS inventory
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSHPASS: ${{ secrets.VPS_ROOT_PASSWORD_1 }}
        run: |
          set -euo pipefail
          audit_file="$RUNNER_TEMP/vps-audit.txt"
          ssh_args=(
            -T
            -p 22
            -o PreferredAuthentications=password
            -o PubkeyAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o NumberOfPasswordPrompts=1
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=10
          )
          set +e
          sshpass -e ssh "${ssh_args[@]}" "$VPS_USER@$VPS_HOST" 'bash -s' >"$audit_file" 2>&1 <<'REMOTE'
          set -u
          printf '%s\n' '=== Host ==='
          hostname 2>/dev/null || true
          id 2>/dev/null || true
          uname -a 2>/dev/null || true
          date -u 2>/dev/null || true
          printf '%s\n' '=== Resources ==='
          df -h / 2>/dev/null || true
          free -h 2>/dev/null || true
          printf '%s\n' '=== Listening ports ==='
          ss -lnt 2>/dev/null | awk 'NR == 1 || /:22|:80|:443|:5432|:3006/' || true
          printf '%s\n' '=== Docker ==='
          docker --version 2>&1 || true
          docker compose version 2>&1 || true
          docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}' 2>&1 || true
          printf '%s\n' '=== PostgreSQL readiness ==='
          if command -v pg_isready >/dev/null 2>&1; then
            pg_isready -h 127.0.0.1 -p 5432 2>&1 || true
          else
            printf '%s\n' 'pg_isready is not installed on the host'
          fi
          REMOTE
          ssh_status=$?
          set -e
          token="$(openssl rand -hex 16)"
          echo "::stop-commands::$token"
          cat "$audit_file"
          echo "::$token::"
          if [[ "$ssh_status" -ne 0 ]]; then
            echo "::error::SSH audit failed (exit code $ssh_status). Check VPS_USER/password authentication."
            exit "$ssh_status"
          fi
