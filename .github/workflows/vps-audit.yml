name: VPS read-only audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Deploy production
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    name: Read-only VPS audit
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[audit deploy]')) || (github.event_name == 'workflow_run' && (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' || github.event.workflow_run.conclusion == 'cancelled') && (github.event.workflow_run.event == 'workflow_run' || github.event.workflow_run.event == 'workflow_dispatch') && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Validate SSH settings and pin host key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_ROOT_PASSWORD_1: ${{ secrets.VPS_ROOT_PASSWORD_1 }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_ROOT_PASSWORD_1 VPS_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is required in the production environment"
              exit 1
            fi
          done
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]] || { echo "::error::VPS_HOST must be an IP address or hostname"; exit 1; }
          [[ "$VPS_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*\$?$ ]] || { echo "::error::VPS_USER contains unsupported characters"; exit 1; }
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]] || { echo "::error::VPS_PORT must be numeric"; exit 1; }
          (( VPS_PORT >= 1 && VPS_PORT <= 65535 )) || { echo "::error::VPS_PORT must be between 1 and 65535"; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          known_hosts_host="$VPS_HOST"
          if [[ "$VPS_PORT" != 22 ]]; then
            known_hosts_host="[$VPS_HOST]:$VPS_PORT"
          fi
          ssh-keygen -F "$known_hosts_host" -f "$HOME/.ssh/known_hosts" >/dev/null || {
            echo "::error::VPS_KNOWN_HOSTS does not contain the configured host"
            exit 1
          }

      - name: Install SSH password client
        run: |
          set -euo pipefail
          if ! command -v sshpass >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y sshpass
          fi

      - name: Run read-only inventory
        env:
          VPS_APP_DIR: ${{ vars.VPS_APP_DIR || '/opt/hadith-hotel-2' }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSHPASS: ${{ secrets.VPS_ROOT_PASSWORD_1 }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
        run: |
          set -euo pipefail
          audit_file="$RUNNER_TEMP/vps-audit.txt"
          configured_app_dir="${VPS_APP_DIR:-/opt/hadith-hotel-2}"
          [[ "$configured_app_dir" =~ ^/[A-Za-z0-9._/-]+$ ]] || exit 1
          ssh_args=(
            -T
            -p "$VPS_PORT"
            -o PreferredAuthentications=password
            -o PubkeyAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o NumberOfPasswordPrompts=1
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=10
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=2
            -o Compression=no
          )
          set +e
          sshpass -e ssh "${ssh_args[@]}" "$VPS_USER@$VPS_HOST" "bash -s -- '$configured_app_dir'" >"$audit_file" 2>&1 <<'REMOTE'
          set -u
          printf 'METRIC configured_app_dir=%s\n' "$1"
          printf '%s\n' '=== Host ==='
          hostname 2>/dev/null || true
          id 2>/dev/null || true
          uname -a 2>/dev/null || true
          date -u 2>/dev/null || true

          printf '%s\n' '=== Resources ==='
          df -h / 2>/dev/null || true
          free -h 2>/dev/null || true
          uptime 2>/dev/null || true
          nproc 2>/dev/null || true
          printf 'METRIC cpus=%s disk_available_kib=%s ram_available_kib=%s rsync=%s\n' "$(nproc)" "$(df -Pk / | awk 'NR==2 {print $4}')" "$(free -k | awk '/^Mem:/ {print $7}')" "$(command -v rsync >/dev/null && printf installed || printf missing)"
          printf 'METRIC staged_public_kib=%s\n' "$(du -sk /opt/hadith-hotel-2/releases/*/web/public 2>/dev/null | awk '{sum+=$1} END {print sum+0}')"
          printf '%s\n' '=== Transfer tools and staged source sizes ==='
          command -v rsync || true
          command -v git || true
          du -sh /opt/hadith-hotel-2/releases/*/web/public /opt/hadith-hotel-2/releases/*/Asset 2>/dev/null || true
          printf '%s\n' '=== GitHub and container registry HTTPS connectivity ==='
          for url in https://github.com https://ghcr.io/v2/; do
            curl --max-time 10 -sS -o /dev/null -w 'HTTP %{http_code}, time %{time_total}s, bytes %{size_download}\n' "$url" || true
          done

          printf '%s\n' '=== Direct GitHub source download benchmark ==='
          curl --max-time 20 -fsS -o /dev/null -w 'METRIC github_download http=%{http_code} bytes=%{size_download} elapsed=%{time_total} speed_bytes_sec=%{speed_download}\n' https://raw.githubusercontent.com/DonnyRZ/hadith-hotel-2/main/web/public/videos/video-2.mp4 || true
          if GIT_TERMINAL_PROMPT=0 timeout 15 git ls-remote https://github.com/DonnyRZ/hadith-hotel-2.git refs/heads/main >/dev/null 2>&1; then
            printf '%s\n' 'METRIC git_read_access=ok'
          else
            printf '%s\n' 'METRIC git_read_access=failed'
          fi

          printf '%s\n' '=== Production target and active build ==='
          if [[ -d /var/www ]]; then
            find /var/www -maxdepth 2 \( -type d -o -type l \) 2>/dev/null | while IFS= read -r directory; do
              printf 'METRIC www_directory=%s\n' "$directory"
            done
          fi
          docker ps --format 'METRIC running_container={{.Names}} image={{.Image}} ports={{.Ports}}' 2>/dev/null || true
          for pid in $(pgrep -x node 2>/dev/null); do
            printf 'METRIC node_pid=%s cwd=%s\n' "$pid" "$(readlink "/proc/$pid/cwd" 2>/dev/null)"
          done
          for container in $(docker ps -q 2>/dev/null); do
            docker inspect "$container" --format 'METRIC container={{.Name}} working_dir={{index .Config.Labels "com.docker.compose.project.working_dir"}} config_files={{index .Config.Labels "com.docker.compose.project.config_files"}}' 2>/dev/null || true
          done
          docker inspect hadith-hotel-2-web --format 'METRIC production_container={{.Name}} project={{index .Config.Labels "com.docker.compose.project"}} working_dir={{index .Config.Labels "com.docker.compose.project.working_dir"}} config_files={{index .Config.Labels "com.docker.compose.project.config_files"}} image={{.Image}}' 2>/dev/null || true
          for directory in "$1" /opt/hadith-hotel-2; do
            [[ -d "$directory/source-cache" ]] || continue
            printf 'METRIC git_cache=%s head=%s\n' "$directory/source-cache" "$(git -C "$directory/source-cache" rev-parse --verify HEAD 2>/dev/null || printf not_checked_out)"
            du -sk "$directory/source-cache/.git" "$directory/source-cache/web/public" 2>/dev/null | while read -r size path; do
              printf 'METRIC cache_size_kib=%s path=%s\n' "$size" "$path"
            done
          done
          ps -eo comm,etime,pcpu,pmem --sort=-pcpu | head -12 | while IFS= read -r process; do
            printf 'METRIC process=%s\n' "$process"
          done
          for config in /etc/nginx/sites-enabled/*; do
            [[ -f "$config" ]] || continue
            grep -E '^[[:space:]]*(server_name|root|proxy_pass)[[:space:]]' "$config" | while IFS= read -r line; do
              printf 'METRIC nginx_config=%s directive=%s\n' "$config" "$line"
            done
          done

          printf '%s\n' '=== Listening ports ==='
          if command -v ss >/dev/null 2>&1; then
            ss -lnt 2>/dev/null | awk 'NR == 1 || /:22|:80|:443|:5432|:3006/' || true
          else
            printf '%s\n' 'ss is not installed'
          fi

          printf '%s\n' '=== Docker ==='
          docker --version 2>&1 || true
          docker compose version 2>&1 || true
          docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}' 2>&1 || true

          printf '%s\n' '=== PostgreSQL readiness ==='
          if command -v pg_isready >/dev/null 2>&1; then
            pg_isready -h 127.0.0.1 -p 5432 2>&1 || true
          else
            printf '%s\n' 'pg_isready is not installed on the host'
          fi

          printf '%s\n' '=== Compose files ==='
          for root in /opt /srv /var/www /root/apps /home; do
            if [[ -d "$root" ]]; then
              find "$root" -maxdepth 5 -type f \
                \( -name docker-compose.yml -o -name compose.yml -o -name compose.yaml \) \
                -print 2>/dev/null | sed 's/^/METRIC compose_file=/' || true
            fi
          done

          printf '%s\n' '=== Environment files: names only ==='
          for root in /opt /srv /var/www /root/apps /home; do
            if [[ -d "$root" ]]; then
              find "$root" -maxdepth 5 -type f -name .env -print 2>/dev/null || true
            fi
          done | while IFS= read -r file; do
            [[ -r "$file" ]] || continue
            printf 'File: %s\n' "$file"
            sed -n 's/^[[:space:]]*\([A-Za-z_][A-Za-z0-9_]*\)=.*/\1/p' "$file" | sort -u
          done
          REMOTE
          ssh_status=$?
          transfer_started=$SECONDS
          printf '%s\n' '=== 4 MiB SSH stdin transfer to wc (no files written) ===' >>"$audit_file"
          head -c 4194304 /dev/zero | timeout 30 sshpass -e ssh "${ssh_args[@]}" "$VPS_USER@$VPS_HOST" 'wc -c' >>"$audit_file" 2>&1
          transfer_status=$?
          printf 'Transfer exit: %s, elapsed: %ss\n' "$transfer_status" "$((SECONDS-transfer_started))" >>"$audit_file"
          set -e
          python3 - "$audit_file" <<'METRICS'
          import pathlib, re, sys
          metrics = '\n'.join(line for line in pathlib.Path(sys.argv[1]).read_text().splitlines() if line.startswith(('METRIC ', 'Transfer exit:')))
          metrics = re.sub(r'(https?://)[^ /]+@', r'\1[redacted]@', metrics)
          metrics = metrics.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::notice title=VPS deployment audit::' + metrics)
          METRICS
          python3 - "$audit_file" "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          import html, pathlib, sys
          data = pathlib.Path(sys.argv[1]).read_text()
          with open(sys.argv[2], 'a') as output:
              output.write('<details open><summary>Read-only deployment diagnostics</summary><pre>' + html.escape(data) + '</pre></details>\n')
          SUMMARY
          token="$(openssl rand -hex 16)"
          echo "::stop-commands::$token"
          cat "$audit_file"
          echo "::$token::"
          if [[ "$ssh_status" -ne 0 ]]; then
            echo "::error::SSH audit failed (exit code $ssh_status). Check SSH reachability, VPS_PORT, VPS_USER/password authentication, and the pinned host key."
            exit "$ssh_status"
          fi
